[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-agent"
version = "0.1.0"
description = "Local-first CTF solving agent for authorized challenges and benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary project scaffold; third-party licenses reviewed before inclusion." }
authors = [
  { name = "liuxinyue" }
]
dependencies = [
  "langgraph>=1.0.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
  "pydantic-ai-slim[openai,anthropic]>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
ctf-agent = "ctf_agent.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that require optional external services such as Docker"
]
